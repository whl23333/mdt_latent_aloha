defaults:
  - callbacks: aloha
  - datamodule: hdf5
  - model: mdt_agent # mdt_agent
  - override hydra/job_logging: colorlog
  - override hydra/hydra_logging: colorlog

# /home/hk-project-robolear/ft4740/code/calvin_d_old/dataset/task_D_D
# /hkfs/work/workspace/scratch/ft4740-play3/data/task_ABC_D
# /hkfs/work/workspace/scratch/ft4740-play3/data/task_ABCD_D
root_data_dir: /hkfs/work/workspace/scratch/ft4740-play3/data/task_ABCD_D
lang_folder: lang_clip_resnet50 
vis_clip_model_name: ViT-B/16 
clip_lang_model_name: ViT-B/32

log_dir: /data/250010208/whl/results/mdt_policy/logs
slurm: false
min_window_size: 21 # 21
max_window_size: 50
future_range: 29
seed: 242
device: 'cuda'
batch_size: 128 # 38 # 128
devices: 1
goal_window_size: 1
act_dim: 7
obs_dim: 384
goal_dim: 512
obs_seq_len: 1
act_seq_len: 10
multistep: 10 #${act_seq_len}
p_last_state: 0
gen_img_res: 112
max_epochs: 35
rollout_lh_skip_epochs: 29
window_sampling_strategy: 'geometric' 
num_tokens_voltron: 3
num_workers: 12
img_gen_frame_diff: 3 
use_extracted_rel_actions: true
benchmark_name: calvin_abcd # calvin_abcd  

pred_latent_motion_embeddings: False
latent_motion_dim: 32
per_latent_motion_len: 8



trainer:
  gpus: ${devices}
  precision: 16
  max_epochs: ${max_epochs}
  sync_batchnorm: false
  accelerator: auto
  limit_train_batches: 1000  
  limit_val_batches: 4

logger:
  _target_: pytorch_lightning.loggers.WandbLogger
  save_dir: .
  name: test
  log_model: false
  entity: whl23333-tsinghua-university
  project: mdt_policy_aloha


hydra:
  run:
    dir: ${log_dir}/runs/${now:%Y-%m-%d}/${now:%H-%M-%S}
  sweep:
    dir: ${log_dir}/runs/${now:%Y-%m-%d}/${now:%H-%M-%S}
    subdir: ${hydra.job.override_dirname}
  job:
    config:
      override_dirname:
        exclude_keys:
          - log_dir
          - datamodule.root_data_dir
          - trainer.gpus
          - datamodule.num_workers
          - trainer.limit_train_batches
          - trainer.limit_val_batches
